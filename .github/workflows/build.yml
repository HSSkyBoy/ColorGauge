name: Build Module

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Package module
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble KernelSU module ZIP
        id: package
        shell: bash
        run: |
          commit_count="$(git rev-list --count HEAD)"
          version="$(sed -n 's/^version=//p' module.prop)"
          package_dir="dist/package"
          archive="dist/O-Pulse-${version}.zip"

          mkdir -p "${package_dir}/webroot"
          sed \
            -e "s/^versionCode=.*/versionCode=${commit_count}/" \
            module.prop > "${package_dir}/module.prop"

          install -m 0755 collector.sh customize.sh service.sh uninstall.sh "${package_dir}/"
          install -m 0644 skip_mount "${package_dir}/skip_mount"
          cp -a webroot/. "${package_dir}/webroot/"

          (
            cd "${package_dir}"
            zip -r "../../${archive}" .
          )

          echo "artifact_name=O-Pulse-${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
